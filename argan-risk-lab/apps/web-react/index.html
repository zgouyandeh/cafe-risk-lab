<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آرگان ریسک‌لب | تصمیم خرید قهوه در شرایط عدم‌قطعیت</title>
    <script>
      // apply the saved theme before first paint (no flash)
      try {
        var t = JSON.parse(localStorage.getItem("argan-theme") || "null");
        var m = (t && t.mode) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.mode = m;
        document.documentElement.dataset.palette = (t && t.palette) || "mocha";
      } catch (e) { document.documentElement.dataset.mode = "light"; document.documentElement.dataset.palette = "mocha"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
